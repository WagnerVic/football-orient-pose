[project]
name = "football-orient-pose"
version = "0.1.0"
description = "Quantitative pipeline for soccer player pose estimation in broadcast video (YOLO26 + RTMPose-X)"
requires-python = ">=3.11"
authors = [
    { name = "Wagner Victor Alves de Menezes" },
    { name = "Victor Gabriel Ribeiro Jacome" },
    { name = "Raphael Alves de Lima Soares" },
    { name = "André Guilherme Alves do Carmo" },
]
readme = "README.md"
license = { text = "MIT" }

dependencies = [
    "torch>=2.0",
    "torchvision",
    "ultralytics",
    "opencv-python>=4.8",
    "pycocotools>=2.0.7",
    "numpy",
    "matplotlib",
    "scipy",
    # CUDA build only ships wheels for Linux x86_64 and Windows; the CPU build covers the rest.
    "onnxruntime-gpu; (sys_platform == 'linux' and platform_machine == 'x86_64') or sys_platform == 'win32'",
    "onnxruntime; sys_platform == 'darwin' or (sys_platform == 'linux' and platform_machine != 'x86_64')",
    "rtmlib",
    "python-dotenv>=1.2.2",
    "gdown>=6.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
    "ipykernel",
    "jupyterlab",
]
download = [
    "yt-dlp>=2024.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/football_orient_pose"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src"]
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.ruff.lint.per-file-ignores]
# MMPose modules must be registered (and src/ put on sys.path) before the remaining imports.
"scripts/training/*.py" = ["E402"]
# Column-aligned H3WB keypoint/skeleton metadata tables.
"src/football_orient_pose/finetuning/dataset.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "integration: tests that need real model weights and/or a GPU (run with -m integration)",
]
addopts = "-m 'not integration'"
